cloud:
  host: "203.0.113.5"     # or DNS name of your cloud box
  grpc_port: 7000
  ws_port: 7080
  rtsp_url: "rtsp://203.0.113.5:8554/reachy"

audio:
  sample_rate: 16000
  chunk_size: 3200        # ~0.2s
  input_device_index: null   # set if you have multiple mics
  output_device_index: null  # set if you want a specific speaker

mqtt:
  broker: "203.0.113.5"
  port: 1883
  base_topic: "reachy"

telemetry:
  interval_sec: 2
  read_cpu_temp: true
  pose_provider: "none"   # later: "i2c" or "serial"

security:
  ws_token_env: "REACHY_WS_TOKEN"
  mqtt_user_env: "MQTT_USER"
  mqtt_pass_env: "MQTT_PASS"