cloud:
  host: "192.168.4.32"   # your Mac’s IP
  grpc_port: 7001
  ws_port: 7080
  rtsp_url: "rtsp://192.168.1.50:8554/reachy"

audio:
  sample_rate: 16000
  chunk_size: 3200
  input_device_index: null   # set to your ReSpeaker index if needed
  output_device_index: null  # or set a number if you use a speaker

mqtt:
  broker: "192.168.1.50"     # optional for telemetry
  port: 1883
  base_topic: "reachy"

telemetry:
  interval_sec: 2
  read_cpu_temp: true
  pose_provider: "none"

security:
  ws_token_env: "REACHY_WS_TOKEN"
  mqtt_user_env: "MQTT_USER"
  mqtt_pass_env: "MQTT_PASS"